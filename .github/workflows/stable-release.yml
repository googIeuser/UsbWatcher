name: Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version number without the v prefix
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows packages
        shell: pwsh
        run: .\scripts\build-windows.ps1 -Version "${{ inputs.version }}"

      - name: Publish stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.version }}"
          $tag = "v$version"
          $installer = "artifacts/USB_Watcher_Setup_$version.exe"
          $portable = "artifacts/USB-Watcher-v$version-win-x64.zip"
          $checksums = "artifacts/SHA256SUMS.txt"

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Use a new version number."
          }

          gh release create $tag $installer $portable $checksums --title "USB Watcher $tag" --generate-notes --latest
